<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find It! - English Game</title>
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
    
    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <h1>Find It! 🐶</h1>
        <div id="new-player-form" class="welcome-form">
            <input type="text" id="player-name-input" placeholder="Enter your name">
            <div style="margin: 15px 0;">
                <label style="font-weight: bold; margin-right: 10px;">Difficulty:</label>
                <div id="welcome-difficulty" class="difficulty-toggle-group" data-value="All">
                    <button class="diff-btn active" onclick="selectDifficulty(this, 'welcome-difficulty', 'All')" data-val="All">🌟 All</button>
                    <button class="diff-btn" onclick="selectDifficulty(this, 'welcome-difficulty', 'Easy')" data-val="Easy">🟢 Easy</button>
                    <button class="diff-btn" onclick="selectDifficulty(this, 'welcome-difficulty', 'Medium')" data-val="Medium">🟡 Medium</button>
                    <button class="diff-btn" onclick="selectDifficulty(this, 'welcome-difficulty', 'Hard')" data-val="Hard">🔴 Hard</button>
                </div>
            </div>
            <br>
            <button id="btn-start-game" class="btn-large">Start Game</button>
        </div>
        <div id="returning-player-form" class="welcome-form hidden">
            <p>Welcome back, <strong id="welcome-player-name"></strong>!</p>
            <p style="display: flex; align-items: center; justify-content: center;"><img src="images/coin.png" class="coin-icon" alt="Coin"> <span id="welcome-score" style="font-weight: bold; font-size: 1.2rem;"></span></p>
            <div style="margin: 15px 0;">
                <label style="font-weight: bold; margin-right: 10px;">Difficulty:</label>
                <div id="returning-difficulty" class="difficulty-toggle-group" data-value="All">
                    <button class="diff-btn active" onclick="selectDifficulty(this, 'returning-difficulty', 'All')" data-val="All">🌟 All</button>
                    <button class="diff-btn" onclick="selectDifficulty(this, 'returning-difficulty', 'Easy')" data-val="Easy">🟢 Easy</button>
                    <button class="diff-btn" onclick="selectDifficulty(this, 'returning-difficulty', 'Medium')" data-val="Medium">🟡 Medium</button>
                    <button class="diff-btn" onclick="selectDifficulty(this, 'returning-difficulty', 'Hard')" data-val="Hard">🔴 Hard</button>
                </div>
            </div>
            <button id="btn-continue-game" class="btn-large">Continue</button>
            <br>
            <button id="btn-restart-game" class="btn-large btn-secondary" style="margin-top: 15px;">Start New Game</button>
        </div>
    </div>

    <!-- Map Screen -->
    <div id="map-screen" class="hidden">
        <div class="map-header">
            <button id="btn-back-to-region" class="btn-topbar btn-secondary" style="display:none; padding: 5px 15px; margin-right:10px;">⬅ Back</button>
            <h2 id="map-title">Select a Zone</h2>
            <div style="font-size: 1.5rem; margin-left: auto; margin-right: 20px; color: #f1c40f; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); display: flex; align-items: center;">
                <img src="images/coin.png" class="coin-icon" alt="Coin"> <span id="map-score">0</span>
            </div>
            <div id="map-difficulty-select" class="difficulty-toggle-group map-mode" data-value="All" style="margin-right: 15px; margin-top: 0; margin-bottom: 0;">
                <button class="diff-btn active" onclick="selectDifficultyMap(this, 'All')" data-val="All" title="All">🌟 All</button>
                <button class="diff-btn" onclick="selectDifficultyMap(this, 'Easy')" data-val="Easy" title="Easy">🟢 Easy</button>
                <button class="diff-btn" onclick="selectDifficultyMap(this, 'Medium')" data-val="Medium" title="Medium">🟡 Medium</button>
                <button class="diff-btn" onclick="selectDifficultyMap(this, 'Hard')" data-val="Hard" title="Hard">🔴 Hard</button>
            </div>
            <a href="petcare.html" class="btn-large" style="display: none; text-decoration:none; background:#ff7675; color:white; font-size:1rem; padding: 5px 15px; margin-right: 10px;">🐶 My Pet</a>
            <button id="btn-back-to-welcome" class="btn-large btn-secondary" style="font-size: 1rem; padding: 5px 15px;">Logout</button>
        </div>
        <div id="map-zones-container" class="map-container">
            <!-- Level nodes injected by JS -->
        </div>

        <!-- Progression Popup -->
        <div id="progression-popup" class="hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000;">
            <div style="background: white; border-radius: 20px; padding: 30px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;">
                <button id="btn-close-progression" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #888;">✖</button>
                <h2 id="progression-title" style="margin-top: 0; color: #2c3e50; font-size: 2rem;">Scene</h2>
                
                <div class="progression-path" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                    <button id="btn-stage-1" class="btn-large" style="background-color: #9b59b6; color: white;">1. 🃏 Flashcards (Quiz)</button>
                    <button id="btn-stage-2" class="btn-large btn-disabled" disabled style="background-color: #bdc3c7; color: #7f8c8d;">2. 🔍 Find It (Locked)</button>
                    <button id="btn-stage-3" class="btn-large btn-disabled" disabled style="background-color: #bdc3c7; color: #7f8c8d;">3. 🔗 Matching (Locked)</button>
                    <button id="btn-stage-4" class="btn-large btn-disabled" disabled style="background-color: #bdc3c7; color: #7f8c8d;">4. ✍️ Spelling (Locked)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scene Complete Screen -->
    <div id="scene-complete-screen" class="hidden">
        <h1>SCENE COMPLETE! 🎉</h1>
        <p>Great job!</p>
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button id="btn-back-to-map" class="btn-large" style="background-color: #f39c12; color: white;">Back to Map</button>
            <button id="btn-next-zone" class="btn-large btn-primary" style="background-color: #2ecc71; color: white; display: none;">Next Scene ⏭️</button>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="hidden">
        <!-- Top Bar -->
        <div id="top-bar">
            <div id="lives">❤️❤️❤️</div>
            
            <div style="margin-left: auto; display: flex; align-items: center; gap: 20px;">
                <div id="score" style="color: #f1c40f; font-weight: bold; font-size: 1.5rem; display: flex; align-items: center;">
                    <img src="images/coin.png" class="coin-icon" alt="Coin"> <span id="score-count">0</span>
                </div>
                <button id="btn-toggle-music" class="btn-topbar btn-music">🔇 Music: OFF</button>
                <button id="btn-quit-zone" class="btn-topbar btn-quit">✖ Quit</button>
            </div>
        </div>

        <!-- Character and Question -->
        <div id="character-area">
            <div id="character-image-container" style="width: 140px; height: 140px;">
                <!-- Mascot Emoji -->
                <svg id="svg-puppy" class="idle" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width: 140px; height: 140px; overflow: visible; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));">
                    <defs>
                        <radialGradient id="furGradient" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                            <stop offset="0%" stop-color="#fceabb" />
                            <stop offset="100%" stop-color="#f8b500" />
                        </radialGradient>
                        <radialGradient id="snoutGradient" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="100%" stop-color="#fde3a7" />
                        </radialGradient>
                        <radialGradient id="eyeGradient" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#6e4c25" />
                            <stop offset="100%" stop-color="#3e2723" />
                        </radialGradient>
                        <linearGradient id="earGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#f8b500" />
                            <stop offset="100%" stop-color="#d35400" />
                        </linearGradient>
                    </defs>

                    <!-- Tail -->
                    <path id="puppy-tail" class="wagging" d="M 120 140 C 160 110, 180 120, 170 90" fill="none" stroke="url(#earGradient)" stroke-width="16" stroke-linecap="round" transform-origin="120 140" style="animation: tailWag 0.5s infinite alternate;"/>
                    
                    <!-- Back Legs -->
                    <path d="M 55 150 C 45 160, 55 185, 75 185 C 85 185, 85 170, 75 160 Z" fill="url(#furGradient)"/>
                    <path d="M 145 150 C 155 160, 145 185, 125 185 C 115 185, 115 170, 125 160 Z" fill="url(#furGradient)"/>
                    
                    <!-- Body -->
                    <g id="puppy-body" style="animation: breathe 2s infinite alternate ease-in-out; transform-origin: 100px 180px;">
                        <path d="M 65 110 C 65 85, 135 85, 135 110 C 145 160, 125 180, 100 180 C 75 180, 55 160, 65 110 Z" fill="url(#furGradient)"/>
                        <!-- Chest fluff -->
                        <path d="M 85 105 C 85 95, 115 95, 115 105 C 125 130, 110 145, 100 145 C 90 145, 75 130, 85 105 Z" fill="#ffffff" opacity="0.8"/>
                    </g>

                    <!-- Front Legs -->
                    <g id="front-legs">
                        <rect x="75" y="135" width="18" height="50" rx="9" fill="url(#furGradient)"/>
                        <rect x="107" y="135" width="18" height="50" rx="9" fill="url(#furGradient)"/>
                        <line x1="80" y1="175" x2="80" y2="183" stroke="#d35400" stroke-width="2" stroke-linecap="round"/>
                        <line x1="87" y1="175" x2="87" y2="183" stroke="#d35400" stroke-width="2" stroke-linecap="round"/>
                        <line x1="112" y1="175" x2="112" y2="183" stroke="#d35400" stroke-width="2" stroke-linecap="round"/>
                        <line x1="119" y1="175" x2="119" y2="183" stroke="#d35400" stroke-width="2" stroke-linecap="round"/>
                    </g>

                    <!-- Collar -->
                    <path d="M 72 108 Q 100 120 128 108" fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="100" cy="116" r="7" fill="#f1c40f"/>
                    <circle cx="100" cy="116" r="4" fill="#f39c12"/>

                    <!-- Head Group -->
                    <g id="puppy-head" class="asking" transform-origin="100 95">
                        <!-- Ears -->
                        <path id="left-ear" d="M 55 60 C 35 65, 20 115, 40 125 C 55 130, 65 95, 68 80 Z" fill="url(#earGradient)" transform-origin="60 70" style="animation: earFlopLeft 2s infinite alternate ease-in-out;"/>
                        <path id="right-ear" d="M 145 60 C 165 65, 180 115, 160 125 C 145 130, 135 95, 132 80 Z" fill="url(#earGradient)" transform-origin="140 70" style="animation: earFlopRight 2s infinite alternate ease-in-out;"/>
                        
                        <!-- Face/Head Base -->
                        <ellipse cx="100" cy="72" rx="48" ry="42" fill="url(#furGradient)"/>
                        
                        <!-- Snout Base -->
                        <ellipse cx="100" cy="92" rx="28" ry="20" fill="url(#snoutGradient)"/>
                        
                        <!-- Eyes Group -->
                        <g id="puppy-eyes" class="blinking" transform-origin="100 70">
                            <!-- Left Eye -->
                            <ellipse cx="80" cy="68" rx="11" ry="15" fill="#fff"/>
                            <ellipse cx="80" cy="68" rx="8" ry="12" fill="url(#eyeGradient)"/>
                            <circle cx="78" cy="64" r="3.5" fill="#fff"/>
                            <circle cx="83" cy="71" r="1.5" fill="#fff"/>
                            <!-- Right Eye -->
                            <ellipse cx="120" cy="68" rx="11" ry="15" fill="#fff"/>
                            <ellipse cx="120" cy="68" rx="8" ry="12" fill="url(#eyeGradient)"/>
                            <circle cx="118" cy="64" r="3.5" fill="#fff"/>
                            <circle cx="123" cy="71" r="1.5" fill="#fff"/>
                        </g>
                        
                        <!-- Eyebrows -->
                        <path d="M 68 50 Q 80 45 88 52" fill="none" stroke="#d35400" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 132 50 Q 120 45 112 52" fill="none" stroke="#d35400" stroke-width="3" stroke-linecap="round"/>

                        <!-- Nose -->
                        <path d="M 90 86 Q 100 82 110 86 C 112 91, 106 95, 100 95 C 94 95, 88 91, 90 86 Z" fill="#3e2723"/>
                        <ellipse cx="96" cy="87" rx="3.5" ry="1.5" fill="#6e4c25" transform="rotate(-15 96 87)"/>
                        
                        <!-- Mouth & Tongue -->
                        <g id="puppy-mouth-group">
                            <path id="puppy-mouth" d="M 88 98 Q 100 110 112 98" fill="none" stroke="#3e2723" stroke-width="3" stroke-linecap="round"/>
                            <path id="puppy-tongue" class="hidden" d="M 94 103 Q 100 118 106 103 Z" fill="#ff7675"/>
                        </g>
                        
                        <!-- Cheeks -->
                        <ellipse cx="65" cy="85" rx="9" ry="6" fill="#ff9999" opacity="0.7"/>
                        <ellipse cx="135" cy="85" rx="9" ry="6" fill="#ff9999" opacity="0.7"/>
                    </g>
                </svg>
            </div>
            <div id="question-bubble" onclick="if(window.replayQuestionAudio) window.replayQuestionAudio();" style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 15px;" title="Click to hear again">
                <p id="question-text" style="margin: 0;">Loading...</p>
                <div class="speaker-btn">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="speaker-icon">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 10 0 0 0 0 14.14M15.54 8.46a5 5 5 0 0 0 0 7.07"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Feedback Area -->
        <div id="feedback-area" class="hidden">
            <span id="feedback-text"></span>
        </div>

        <!-- Image Area -->
        <div id="image-area">
            <div id="image-wrapper">
                <img id="scene-image" src="" alt="Scene">
                <div id="hotspots-container"></div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <h1 style="color: #e74c3c; font-size: 3rem; margin-bottom: 10px;">OUT OF LIVES! 💔</h1>
            <p style="font-size: 1.5rem; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;"><img src="images/coin.png" class="coin-icon" style="width: 32px; height: 32px;" alt="Coin"> <span style="color: #f1c40f; font-weight: bold;"><span id="final-score">0</span></span></p>
            <div style="display: flex; gap: 15px; margin-bottom: 30px;">
                <button id="btn-buy-1-life" class="btn-large" style="background-color: #f1c40f; color: #333; font-size: 1.2rem; border-radius: 15px;">+1 Life<br><small style="display: flex; align-items: center; justify-content: center;"><img src="images/coin.png" class="coin-icon" style="width: 16px; height: 16px;" alt="Coin"> 100</small></button>
                <button id="btn-buy-3-lives" class="btn-large" style="background-color: #f39c12; color: #333; font-size: 1.2rem; border-radius: 15px;">+3 Lives<br><small style="display: flex; align-items: center; justify-content: center;"><img src="images/coin.png" class="coin-icon" style="width: 16px; height: 16px;" alt="Coin"> 250</small></button>
            </div>
            <div style="display: flex; gap: 15px;">
                <button id="play-again-btn" class="btn-secondary" style="font-size: 1rem; padding: 10px 20px; border-radius: 20px;">Restart Scene</button>
                <button id="btn-gameover-map" class="btn-secondary" style="font-size: 1rem; padding: 10px 20px; border-radius: 20px;">Back to Map</button>
            </div>
        </div>
    </div>


    <script>
        function selectDifficulty(btn, containerId, val) {
            const container = document.getElementById(containerId);
            if(container) {
                container.dataset.value = val;
                Array.from(container.querySelectorAll('.diff-btn')).forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
        }
        function selectDifficultyMap(btn, val) {
            selectDifficulty(btn, 'map-difficulty-select', val);
            if(window.gameDifficulty !== undefined) {
                window.gameDifficulty = val;
                localStorage.setItem('gameDifficulty', val);
                if(typeof renderMap === 'function') renderMap();
            }
        }
        function setDifficultyUI(containerId, val) {
            const container = document.getElementById(containerId);
            if(container) {
                container.dataset.value = val;
                Array.from(container.querySelectorAll('.diff-btn')).forEach(b => {
                    b.classList.remove('active');
                    if(b.dataset.val === val) b.classList.add('active');
                });
            }
        }
    </script>
    <!-- JSON data loaded via fetch in game.js -->

    <script src="js/storage.js?v=2"></script>
    <script src="js/game.js?v=2"></script>
</body>
</html>
