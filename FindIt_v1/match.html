<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matching - Puppy Learn English</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #81ecec; margin: 0; overflow: hidden; }
        
        .match-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100%;
            padding: 20px;
            flex: 1;
        }

        .col-left, .col-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 40%;
        }

        .match-item {
            background: white;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s;
            border: 4px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            position: relative;
        }

        .match-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .match-item.selected {
            border-color: #f1c40f;
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3);
        }

        .match-item.matched {
            border-color: #2ecc71;
            background-color: #e8f8f5;
            cursor: default;
            opacity: 0.7;
            transform: scale(0.95);
        }

        .match-text {
            font-size: 2rem;
            font-family: 'Fredoka One', cursive;
            color: #2c3e50;
        }

        /* SVG Line Canvas */
        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <svg id="line-canvas" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1000;"></svg>

    <div id="game-container" style="display: flex; flex-direction: column; width: 100%; max-width: 900px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; height: 90vh;">
        <!-- Top Bar -->
        <div id="top-bar">
            <div id="lives">❤️❤️❤️</div>
            <h2 style="color:white; margin:0; font-family:'Fredoka One'; text-shadow:2px 2px 0 #333;">Match the pairs!</h2>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 20px;">
                <div id="score" style="color: #f1c40f; font-weight: bold; font-size: 1.5rem; display: flex; align-items: center;">
                    <img src="images/coin.png" class="coin-icon" alt="Coin"> <span id="score-count">0</span>
                </div>
                <button id="btn-toggle-music" class="btn-topbar btn-music">🔇 Music: OFF</button>
                <button id="btn-quit-zone" class="btn-topbar btn-quit">✖ Quit</button>
            </div>
        </div>

        <div class="match-container">
            <div class="col-left" id="images-col">
                <!-- Image items will be injected here -->
            </div>
            <div class="col-right" id="texts-col">
                <!-- Text items will be injected here -->
            </div>
        </div>
    </div>

    <!-- Game Over Screen (Hidden by default) -->
    <div id="game-over-screen" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h1 id="game-over-title" style="color: #f1c40f; font-size: 4rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); font-family: 'Fredoka One'; text-align: center;">Stage 3 Complete! 🎉</h1>
        <p style="color: white; font-size: 1.5rem;">Great job connecting the words!</p>
        <button id="btn-finish" class="btn-large" style="margin-top: 30px;">Continue</button>
    </div>

    <script src="js/storage.js?v=2"></script>
    <script src="js/match.js?v=2"></script>
</body>
</html>
