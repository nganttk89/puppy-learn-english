<!DOCTYPE html>
<html>
<head>
    <title>Find Coordinates</title>
</head>
<body>
    <h1>Click the animals in this exact order: cat, dog, cow, duck, goat, horse, sheep, pet, mouse, tail</h1>
    <img id="img" src="images/farm_animals.jpg" width="1280" height="720" style="cursor:crosshair;">
    <div id="output" style="margin-top:20px; font-family:monospace; white-space:pre;">[]</div>
    <script>
        const animals = ["cat", "dog", "cow", "duck", "goat", "horse", "sheep", "pet", "mouse", "tail"];
        let index = 0;
        let results = [];
        const img = document.getElementById('img');
        const output = document.getElementById('output');

        img.addEventListener('click', (e) => {
            if (index < animals.length) {
                const rect = img.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                results.push({
                    id: animals[index],
                    name: animals[index],
                    x: Math.round(x - 50),
                    y: Math.round(y - 50),
                    width: 100,
                    height: 100
                });
                
                index++;
                output.innerText = JSON.stringify(results, null, 2);
            }
        });
    </script>
</body>
</html>
