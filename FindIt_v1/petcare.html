<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care - Puppy Learn English</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        body { background: #ffeaa7; font-family: 'Nunito', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #game-container { position: relative; width: 100%; max-width: 900px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; height: 90vh; display: flex; flex-direction: column; }
        
        #top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #fdcb6e; color: #2d3436; }
        .stat-box { background: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 1.5em; box-shadow: 0 4px 0 #e1b12c; display: flex; align-items: center; gap: 10px; }
        
        #room-area { flex: 1; background-color: #f1f2f6; background-image: url('images/bedroom.jpg'); background-repeat: no-repeat; background-position: center bottom; background-size: cover; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; transition: background-image 0.5s ease-in-out; }
        
        #room-area.room-bedroom { background-image: url('images/bedroom.jpg'); }
        #room-area.room-kitchen { background-image: url('images/kitchen.jpg'); }
        #room-area.room-bathroom { background-image: url('images/bathroom.jpg'); }
        #room-area.room-garden { background-image: url('images/garden.jpg'); }
        
        .pet-container { width: 250px; height: 250px; position: relative; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: bottom center; }
        
        /* Make puppy sit on the bed */
        #room-area.room-bedroom .pet-container {
            transform: translateY(-120px) scale(0.9);
        }
        
        /* Make puppy sit IN the bathtub */
        #room-area.room-bathroom .pet-container {
            transform: translateY(-100px) scale(0.8);
            clip-path: polygon(0 0, 100% 0, 100% 70%, 0 70%);
        }
        
        #actions-bar { background: white; padding: 20px; display: flex; justify-content: center; gap: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); }
        .action-btn { background: #74b9ff; color: white; border: none; border-radius: 20px; padding: 15px 30px; font-size: 1.5em; font-family: 'Fredoka One', cursive; cursor: pointer; transition: all 0.2s; box-shadow: 0 6px 0 #0984e3; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .action-btn:hover { transform: translateY(-5px); box-shadow: 0 11px 0 #0984e3; }
        .action-btn:active { transform: translateY(6px); box-shadow: none; }
        .action-btn:disabled { background: #dfe6e9; box-shadow: 0 6px 0 #b2bec3; cursor: not-allowed; transform: none; }
        .action-price { font-size: 0.6em; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 10px; }
        
        .bubble { position: absolute; font-size: 3em; animation: burstOut 1.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; opacity: 0; pointer-events: none; }
        @keyframes burstOut { 
            0% { opacity: 1; transform: translate(0, 0) scale(0.1); } 
            50% { opacity: 1; transform: translate(var(--end-x), var(--end-y)) scale(1.5); } 
            100% { opacity: 0; transform: translate(var(--end-x), calc(var(--end-y) - 50px)) scale(1); } 
        }
        
        .glow-anim { animation: roomGlow 1s ease-out; }
        @keyframes roomGlow {
            0% { box-shadow: inset 0 0 0 rgba(255, 255, 255, 0); }
            50% { box-shadow: inset 0 0 100px rgba(255, 255, 255, 0.8); }
            100% { box-shadow: inset 0 0 0 rgba(255, 255, 255, 0); }
        }
        
        /* Drag and Drop Styles */
        .draggable-item {
            position: absolute;
            font-size: 5em;
            cursor: grab;
            z-index: 100;
            user-select: none;
            touch-action: none;
            display: none;
            animation: bounce 1s infinite alternate;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
        }
        .draggable-item:active {
            cursor: grabbing;
            animation: none;
            transform: scale(1.1);
        }
        
        .drop-hint {
            position: absolute;
            top: 20%;
            font-size: 2em;
            color: #d63031;
            font-weight: bold;
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0px white;
            display: none;
            pointer-events: none;
            animation: pulse 1s infinite alternate;
        }

        #message-box { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #ff7675; padding: 15px 30px; border-radius: 30px; font-size: 1.5em; font-weight: bold; color: white; display: none; z-index: 10; font-family: 'Fredoka One', cursive; box-shadow: 0 5px 15px rgba(214, 48, 49, 0.4); text-align: center; width: 80%; max-width: 500px; animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { opacity: 0; transform: translate(-50%, -20px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
        
        /* Ambient Effects Animations */
        @keyframes flutter { 0% { transform: translate(0,0) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(100px, -50px) rotate(15deg); } 90% { opacity: 1; } 100% { transform: translate(200px, -10px) rotate(-10deg); opacity: 0; } }
        @keyframes driftRight { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateX(100vw); opacity: 0; } }
        @keyframes floatUpSlow { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: translateY(-200px) scale(1.5); opacity: 0; } }
        @keyframes steamRise { 0% { transform: translateY(0) scale(1); opacity: 0; } 20% { opacity: 0.6; } 100% { transform: translateY(-100px) scale(2); opacity: 0; } }
        @keyframes twinkleFloat { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 50% { transform: translateY(-30px) scale(1.2); opacity: 1; } 100% { transform: translateY(-60px) scale(0.5); opacity: 0; } }
        
        #pet-stats {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .stat-bar-container { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.9); padding: 5px 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .stat-icon { font-size: 1.2em; }
        .stat-bar { width: 120px; height: 12px; background: #dfe6e9; border-radius: 10px; overflow: hidden; border: 2px solid white; }
        .stat-fill { height: 100%; transition: width 0.3s ease-out, background-color 0.3s; }
        
        #room-clock {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 2.5em;
            font-weight: bold;
            color: #2d3436;
            border: 4px solid #74b9ff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'Fredoka One', cursive;
            display: none;
            z-index: 5;
        }

        #wardrobe-hotspot {
            position: absolute;
            top: 30%;
            left: 5%;
            width: 25%;
            height: 50%;
            cursor: pointer;
            z-index: 5;
            display: none;
        }
        
        .shop-menu {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            flex-direction: column;
            gap: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: none;
            z-index: 10;
        }
        .shop-item {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 10px;
            background: #f1f2f6;
            border-radius: 15px;
            min-width: 70px;
        }
        .shop-item:hover { transform: scale(1.1); background: #eccc68; }
        .shop-item .emoji { font-size: 3em; display: block; margin-bottom: 5px; }
        .shop-item .price { font-size: 1.2em; font-weight: bold; color: #d63031; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="top-bar">
            <a href="index.html" class="btn" style="background:#ff7675; color:white; padding:10px 20px; border-radius:20px; text-decoration:none; font-family:'Fredoka One', cursive; box-shadow:0 4px 0 #d63031; font-size: 1.2em;">← Map</a>
            <div class="stat-box">
                <img src="images/coin.png" style="width: 30px; height: 30px;" alt="Coin"> <span id="coin-count">0</span>
            </div>
        </div>
        
        <div id="room-area">
            <div id="pet-stats">
                <div class="stat-bar-container"><div class="stat-icon">🍖</div><div class="stat-bar"><div class="stat-fill" id="fill-fullness" style="background:#ff7675; width:100%;"></div></div></div>
                <div class="stat-bar-container"><div class="stat-icon">🎾</div><div class="stat-bar"><div class="stat-fill" id="fill-happiness" style="background:#fdcb6e; width:100%;"></div></div></div>
                <div class="stat-bar-container"><div class="stat-icon">🛁</div><div class="stat-bar"><div class="stat-fill" id="fill-hygiene" style="background:#74b9ff; width:100%;"></div></div></div>
                <div class="stat-bar-container"><div class="stat-icon">💤</div><div class="stat-bar"><div class="stat-fill" id="fill-energy" style="background:#a29bfe; width:100%;"></div></div></div>
            </div>

            <div id="message-box">Not enough coins!</div>
            <div class="drop-hint" id="drop-hint">Drag here! ⬇️</div>
            
            <div id="room-clock">14:30</div>
            <div id="wardrobe-hotspot" onclick="openWardrobe()"></div>
            
            <div id="kitchen-menu" class="shop-menu">
                <div class="shop-item" onclick="buyItem('feed', 5, '🍎')"><span class="emoji">🍎</span><span class="price">5</span></div>
                <div class="shop-item" onclick="buyItem('feed', 15, '🍔')"><span class="emoji">🍔</span><span class="price">15</span></div>
                <div class="shop-item" onclick="buyItem('feed', 30, '🥩')"><span class="emoji">🥩</span><span class="price">30</span></div>
            </div>

            <div id="garden-menu" class="shop-menu">
                <div class="shop-item" onclick="buyItem('play', 5, '🎾')"><span class="emoji">🎾</span><span class="price">5</span></div>
                <div class="shop-item" onclick="buyItem('play', 10, '🥏')"><span class="emoji">🥏</span><span class="price">10</span></div>
                <div class="shop-item" onclick="buyItem('play', 30, '🦴')"><span class="emoji">🦴</span><span class="price">30</span></div>
            </div>
            
            <div id="bathroom-menu" class="shop-menu">
                <div class="shop-item" onclick="buyItem('wash', 15, '🧽')"><span class="emoji">🧽</span><span class="price">15</span></div>
                <div class="shop-item" onclick="buyItem('wash', 25, '🧴')"><span class="emoji">🧴</span><span class="price">25</span></div>
            </div>
            
            <div class="pet-container" id="pet">
                <svg id="svg-puppy" class="idle" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));">
                    <defs>
                        <radialGradient id="furGradient" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                            <stop offset="0%" stop-color="#fceabb" />
                            <stop offset="100%" stop-color="#f8b500" />
                        </radialGradient>
                        <radialGradient id="snoutGradient" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="100%" stop-color="#fde3a7" />
                        </radialGradient>
                        <radialGradient id="eyeGradient" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#6e4c25" />
                            <stop offset="100%" stop-color="#3e2723" />
                        </radialGradient>
                        <linearGradient id="earGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#f8b500" />
                            <stop offset="100%" stop-color="#d35400" />
                        </linearGradient>
                    </defs>

                    <!-- Tail -->
                    <path id="puppy-tail" class="wagging" d="M 120 140 C 160 110, 180 120, 170 90" fill="none" stroke="url(#earGradient)" stroke-width="16" stroke-linecap="round" transform-origin="120 140" style="animation: tailWag 0.5s infinite alternate;"/>
                    
                    <!-- Back Legs -->
                    <path d="M 55 150 C 45 160, 55 185, 75 185 C 85 185, 85 170, 75 160 Z" fill="url(#furGradient)"/>
                    <path d="M 145 150 C 155 160, 145 185, 125 185 C 115 185, 115 170, 125 160 Z" fill="url(#furGradient)"/>
                    
                    <!-- Body -->
                    <g id="puppy-body" style="animation: breathe 2s infinite alternate ease-in-out; transform-origin: 100px 180px;">
                        <path d="M 65 110 C 65 85, 135 85, 135 110 C 145 160, 125 180, 100 180 C 75 180, 55 160, 65 110 Z" fill="url(#furGradient)"/>
                        <!-- Chest fluff -->
                        <path d="M 85 105 C 85 95, 115 95, 115 105 C 125 130, 110 145, 100 145 C 90 145, 75 130, 85 105 Z" fill="#ffffff" opacity="0.8"/>
                    </g>

                    <!-- Front Legs -->
                    <g id="front-legs">
                        <rect x="75" y="135" width="18" height="50" rx="9" fill="url(#furGradient)"/>
                        <rect x="107" y="135" width="18" height="50" rx="9" fill="url(#furGradient)"/>
                        <line x1="80" y1="175" x2="80" y2="183" stroke="#d35400" stroke-width="2" stroke-linecap="round"/>
                        <line x1="87" y1="175" x2="87" y2="183" stroke="#d35400" stroke-width="2" stroke-linecap="round"/>
                        <line x1="112" y1="175" x2="112" y2="183" stroke="#d35400" stroke-width="2" stroke-linecap="round"/>
                        <line x1="119" y1="175" x2="119" y2="183" stroke="#d35400" stroke-width="2" stroke-linecap="round"/>
                    </g>

                    <!-- Collar -->
                    <path d="M 72 108 Q 100 120 128 108" fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="100" cy="116" r="7" fill="#f1c40f"/>
                    <circle cx="100" cy="116" r="4" fill="#f39c12"/>

                    <!-- Head Group -->
                    <g id="puppy-head" class="asking" transform-origin="100 95">
                        <!-- Ears -->
                        <path id="left-ear" d="M 55 60 C 35 65, 20 115, 40 125 C 55 130, 65 95, 68 80 Z" fill="url(#earGradient)" transform-origin="60 70" style="animation: earFlopLeft 2s infinite alternate ease-in-out;"/>
                        <path id="right-ear" d="M 145 60 C 165 65, 180 115, 160 125 C 145 130, 135 95, 132 80 Z" fill="url(#earGradient)" transform-origin="140 70" style="animation: earFlopRight 2s infinite alternate ease-in-out;"/>
                        
                        <!-- Face/Head Base -->
                        <ellipse cx="100" cy="72" rx="48" ry="42" fill="url(#furGradient)"/>
                        
                        <!-- Snout Base -->
                        <ellipse cx="100" cy="92" rx="28" ry="20" fill="url(#snoutGradient)"/>
                        
                        <!-- Eyes Group -->
                        <g id="puppy-eyes" class="blinking" transform-origin="100 70">
                            <!-- Left Eye -->
                            <ellipse cx="80" cy="68" rx="11" ry="15" fill="#fff"/>
                            <ellipse cx="80" cy="68" rx="8" ry="12" fill="url(#eyeGradient)"/>
                            <circle cx="78" cy="64" r="3.5" fill="#fff"/>
                            <circle cx="83" cy="71" r="1.5" fill="#fff"/>
                            <!-- Right Eye -->
                            <ellipse cx="120" cy="68" rx="11" ry="15" fill="#fff"/>
                            <ellipse cx="120" cy="68" rx="8" ry="12" fill="url(#eyeGradient)"/>
                            <circle cx="118" cy="64" r="3.5" fill="#fff"/>
                            <circle cx="123" cy="71" r="1.5" fill="#fff"/>
                        </g>
                        
                        <!-- Eyebrows -->
                        <path d="M 68 50 Q 80 45 88 52" fill="none" stroke="#d35400" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 132 50 Q 120 45 112 52" fill="none" stroke="#d35400" stroke-width="3" stroke-linecap="round"/>

                        <!-- Nose -->
                        <path d="M 90 86 Q 100 82 110 86 C 112 91, 106 95, 100 95 C 94 95, 88 91, 90 86 Z" fill="#3e2723"/>
                        <ellipse cx="96" cy="87" rx="3.5" ry="1.5" fill="#6e4c25" transform="rotate(-15 96 87)"/>
                        
                        <!-- Mouth & Tongue -->
                        <g id="puppy-mouth-group">
                            <path id="puppy-mouth" d="M 88 98 Q 100 110 112 98" fill="none" stroke="#3e2723" stroke-width="3" stroke-linecap="round"/>
                            <path id="puppy-tongue" class="hidden" d="M 94 103 Q 100 118 106 103 Z" fill="#ff7675"/>
                        </g>
                        
                        <!-- Cheeks -->
                        <ellipse cx="65" cy="85" rx="9" ry="6" fill="#ff9999" opacity="0.7"/>
                        <ellipse cx="135" cy="85" rx="9" ry="6" fill="#ff9999" opacity="0.7"/>
                    </g>
                </svg>
            </div>
        </div>
        
        <div id="actions-bar">
            <button class="action-btn" onclick="changeRoom('bedroom')" style="background: #0984e3; box-shadow: 0 6px 0 #074b83;">
                Sleep
            </button>
            <button class="action-btn" onclick="changeRoom('kitchen')" style="background: #fdcb6e; box-shadow: 0 6px 0 #e1b12c; color: #2d3436;">
                Feed
            </button>
            <button class="action-btn" onclick="changeRoom('bathroom')" style="background: #00b894; box-shadow: 0 6px 0 #009879;">
                Wash
            </button>
            <button class="action-btn" onclick="changeRoom('garden')" style="background: #a29bfe; box-shadow: 0 6px 0 #6c5ce7;">
                Play
            </button>
        </div>
        
        <!-- Draggable item spawned by JS -->
        <div id="drag-item" class="draggable-item">🥩</div>
    </div>
    
    <script src="js/storage.js?v=3"></script>
    <script src="js/petcare.js?v=3"></script>
</body>
</html>
